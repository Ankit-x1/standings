[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-standings-model"
version = "0.1.0"
description = "Independent Poisson Premier League match and season modeling"
readme = {text = "Independent Poisson Premier League match and season modeling.", content-type = "text/markdown"}
requires-python = ">=3.11"
authors = [{name = "Math 3315 project team"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.1",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
dev = ["pytest>=7.4", "openpyxl>=3.1"]

[project.scripts]
standings = "standings.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
